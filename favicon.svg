<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Tektrend Terracotta & Champagne Gold Gradient -->
    <linearGradient id="tekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#e49366"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Accent Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#e49366"/>
    </linearGradient>

    <!-- Subtle Outer Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(228, 147, 102, 0.25)" stroke-width="2"/>

  <!-- Geometric Tech Pattern Background (Faint Grid Lines) -->
  <path d="M128 0v512M256 0v512M384 0v512M0 128h512M0 256h512M0 384h512" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Tektrend "T" Monogram (Architectural & Sleek) -->
  <g filter="url(#glow)">
    <!-- Top Bar of T with Angled Cut -->
    <path d="M112 144 C112 130.7 122.7 120 136 120 L376 120 C389.3 120 400 130.7 400 144 L400 188 C400 201.3 389.3 212 376 212 L308 212 L308 376 C308 389.3 297.3 400 284 400 L228 400 C214.7 400 204 389.3 204 376 L204 212 L136 212 C122.7 212 112 201.3 112 188 Z" fill="url(#tekGrad)"/>
    
    <!-- Signature Glowing Accent Dot -->
    <circle cx="396" cy="380" r="26" fill="url(#dotGrad)"/>
  </g>
</svg>
